<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nombre de tu curso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600&family=Source+Serif+4:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header class="barra">
  <div class="ancho">
    <a class="marca" href="#inicio" id="marca"></a>
    <nav aria-label="Principal">
      <a href="#inicio">Inicio</a>
      <a href="#curso">Lecciones</a>
      <a href="#sobre-mi">Sobre mí</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </div>
</header>

<main>
  <section id="inicio">
    <div class="ancho portada">
      <div>
        <h1 id="nombre-curso"></h1>
        <p class="frase" id="frase"></p>
        <a class="boton" href="#curso">Ver lecciones</a>
      </div>
      <div class="aprenderas">
        <h2>Qué aprenderás</h2>
        <ul id="aprenderas"></ul>
      </div>
    </div>
  </section>

  <section id="curso">
    <div class="ancho">
      <h2>Lecciones</h2>
      <div class="reproductor">
        <div>
          <div class="video" id="video"></div>
          <h3 id="titulo"></h3>
          <p id="descripcion"></p>
        </div>
        <nav class="lista" aria-label="Lista de lecciones">
          <h3>Contenido del curso</h3>
          <ol id="lista"></ol>
        </nav>
      </div>
    </div>
  </section>

  <section id="sobre-mi">
    <div class="ancho">
      <h2>Sobre mí</h2>
      <div class="perfil">
        <div class="foto" id="foto"></div>
        <div>
          <h3 id="prof-nombre"></h3>
          <p id="prof-bio"></p>
        </div>
      </div>
    </div>
  </section>

  <section id="contacto">
    <div class="ancho">
      <h2>Contacto</h2>
      <p id="contacto-texto"></p>
      <div class="botones">
        <a class="boton" id="btn-whatsapp" href="#" target="_blank" rel="noopener">Escribir por WhatsApp</a>
        <a class="boton claro" id="btn-email" href="#">Enviar un correo</a>
      </div>
    </div>
  </section>
</main>

<footer><div class="ancho" id="pie"></div></footer>

<script src="js/script.js"></script>
</body>
</html>
