<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mi curso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:#F1F5F4; --tinta:#12302C; --suave:#4C6662; --linea:#C9D8D5;
    --panel:#FFFFFF; --acento:#E2A400; --acento-texto:#12302C;
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:1rem}
  body{margin:0;background:var(--fondo);color:var(--tinta);
    font-family:"Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.55}
  header{padding:1.5rem clamp(1rem,4vw,3rem);border-bottom:1px solid var(--linea);background:var(--panel)}
  header h1{margin:0;font-size:1.5rem}
  header p{margin:.25rem 0 0;color:var(--suave)}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:2rem;
    padding:1.5rem clamp(1rem,4vw,3rem);max-width:80rem;margin:0 auto}
  .video{position:relative;aspect-ratio:16/9;background:#0d1f1c;border-radius:6px;overflow:hidden}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .aviso{display:grid;place-items:center;height:100%;padding:1rem;text-align:center;color:#cfe0dd}
  #titulo{margin:1rem 0 .25rem;font-size:1.6rem}
  #descripcion{margin:0;max-width:65ch;color:var(--suave)}
  nav h2{margin:0 0 .75rem;font-size:1.1rem}
  nav ol{list-style:none;margin:0;padding:0;border:1px solid var(--linea);border-radius:6px;background:var(--panel)}
  nav li + li{border-top:1px solid var(--linea)}
  nav a{display:block;padding:.8rem 1rem;color:inherit;text-decoration:none;border-left:4px solid transparent}
  nav a:hover{background:var(--fondo)}
  nav a[aria-current="true"]{border-left-color:var(--acento);background:#FFF7DB;font-weight:700}
  nav small{display:block;color:var(--suave);font-weight:400}
  a:focus-visible{outline:3px solid var(--tinta);outline-offset:-3px}
  @media (max-width:52rem){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Nombre de tu curso</h1>
  <p>Escribe aquí una frase que diga qué van a aprender.</p>
</header>

<main class="layout">
  <section aria-live="polite">
    <div class="video" id="video"></div>
    <h2 id="titulo"></h2>
    <p id="descripcion"></p>
  </section>
  <nav aria-label="Lecciones">
    <h2>Lecciones</h2>
    <ol id="lista"></ol>
  </nav>
</main>

<script>
  // ============ EDITA SOLO ESTA LISTA ============
  // id = lo que va después de "v=" en el enlace de YouTube
  // (https://www.youtube.com/watch?v=AQUI_ESTA_EL_ID)
  const lecciones = [
    { id: "ID_VIDEO_1", titulo: "Lección 1: Introducción", duracion: "10 min",
      descripcion: "Qué vamos a ver y cómo aprovechar el curso." },
    { id: "ID_VIDEO_2", titulo: "Lección 2: Primeros pasos", duracion: "15 min",
      descripcion: "Descripción corta de esta lección." },
    { id: "ID_VIDEO_3", titulo: "Lección 3: Práctica", duracion: "20 min",
      descripcion: "Descripción corta de esta lección." }
  ];
  // ===============================================

  const lista = document.getElementById("lista");
  const video = document.getElementById("video");

  lecciones.forEach((l, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<a href="#leccion-${i + 1}">${l.titulo}<small>${l.duracion}</small></a>`;
    lista.appendChild(li);
  });

  function mostrar() {
    const n = parseInt((location.hash.match(/leccion-(\d+)/) || [])[1] || 1, 10);
    const i = Math.min(Math.max(n, 1), lecciones.length) - 1;
    const l = lecciones[i];
    document.getElementById("titulo").textContent = l.titulo;
    document.getElementById("descripcion").textContent = l.descripcion;
    document.title = l.titulo;
    video.innerHTML = l.id.startsWith("ID_VIDEO")
      ? '<div class="aviso">Pon aquí el ID de tu vídeo de YouTube en la lista de lecciones.</div>'
      : `<iframe src="https://www.youtube-nocookie.com/embed/${l.id}?rel=0"
           title="${l.titulo}" allow="fullscreen" allowfullscreen></iframe>`;
    lista.querySelectorAll("a").forEach((a, j) =>
      a.setAttribute("aria-current", j === i ? "true" : "false"));
  }
  window.addEventListener("hashchange", mostrar);
  mostrar();
</script>
</body>
</html>
